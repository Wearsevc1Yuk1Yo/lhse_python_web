{% extends "base.html" %}
{% block title %}📝 Новый пост{% endblock %}
{% block header %}📝 Создать новый пост{% endblock %}

{% block content %}
<div class="form-container">
    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>Заголовок поста *</label>
            <input type="text" name="title" placeholder="Введите заголовок..." 
                   required maxlength="500" value="{{ request.form.title or '' }}">
        </div>
        
        <div class="form-group">
            <label>Текст поста *</label>
            <textarea name="content" rows="10" placeholder="Напишите текст поста..." 
                      required>{{ request.form.content or '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: space-between; align-items: center;">
            <a href="/" class="btn" style="background: var(--secondary); color: var(--text-primary);">← Отмена</a>
            <button type="submit" class="btn">📤 Опубликовать пост</button>
        </div>
    </form>
</div>
{% endblock %}
