<!DOCTYPE html>
<html>
<head>
    <title>Создание пользователя</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Создание пользователя</h1>

    <div class="alert alert-success">
        <p>Создайте пользователя чтобы начать публиковать посты в блоге!</p>
    </div>

    <form method="post" action="/create-user">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" required placeholder="user@example.com">
            <small>Будет использоваться для входа</small>
        </div>
        <div class="form-group">
            <label>Логин:</label>
            <input type="text" name="login" required placeholder="Ваш публичный логин">
            <small>Будет отображаться как имя автора</small>
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" name="password" required placeholder="Минимум 3 символа">
            <small>Пароль должен содержать не менее 3 символов</small>
        </div>
        <button type="submit" class="btn-primary">Создать пользователя</button>
    </form>

    <div class="nav">
        <a href="/">← На главную</a>
        {% if users_count > 0 %}
        | <a href="/create-post">📝 Создать пост</a>
        {% endif %}
    </div>
</body>
</html>
