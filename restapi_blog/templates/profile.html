<!DOCTYPE html>
<html>
<head>
    <title>Профиль пользователя</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Мой профиль</h1>
            <div class="user-panel">
                <div class="user-info">
                    <span>Вы вошли как: <strong>{{ current_user.login }}</strong></span>
                    <div class="user-actions">
                        <a href="/logout" class="btn-secondary">Выйти</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="profile-container">
            <div class="profile-info">
                <h2>Информация о пользователе</h2>
                <div class="form-group">
                    <label>Логин:</label>
                    <p>{{ current_user.login }}</p>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <p>{{ current_user.email }}</p>
                </div>
                <div class="form-group">
                    <label>Дата регистрации:</label>
                    <p>{{ current_user.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
                </div>
            </div>

            <div class="profile-actions">
                <h2>Действия</h2>
                <div class="action-buttons">
                    <a href="/profile/edit" class="btn-primary">Редактировать профиль</a>
                    <a href="/favorites" class="btn-primary">Избранные посты</a>
                    <a href="/subscriptions" class="btn-primary">Подписки</a>
                </div>
            </div>
        </div>

        <div class="nav">
            <a href="/" class="btn-secondary">← На главную</a>
        </div>
    </div>
</body>
</html>
